name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check_secrets.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.satquery.example
      - name: Build production frontend image
        run: docker build -f Dockerfile.prod --build-arg VITE_API_BASE_URL=https://api.satquery.example -t satquery-frontend:ci .

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - name: Audit locked production dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o /tmp/requirements.txt
          uvx pip-audit==2.10.1 -r /tmp/requirements.txt --disable-pip --progress-spinner off
      - run: uv run pytest
      - name: Build production backend and check native imports
        run: |
          docker build -f Dockerfile.prod -t satquery-backend:ci .
          docker run --rm --network none --entrypoint /app/.venv/bin/python -e SATQUERY_CORS_ORIGINS=https://satquery.example -e SATQUERY_TRUSTED_ASSET_HOSTS=sentinel-cogs.s3.us-west-2.amazonaws.com satquery-backend:ci -c 'import rasterio; from app.main import app; assert app.title'

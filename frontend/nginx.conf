# Static serving for the built SatQuery frontend.
#
# THE RULE THAT MATTERS IS THE FIRST ONE. A single-page application is normally
# served with "try any file, otherwise index.html", and applied to /assets/ that
# rule is how a missing build artefact becomes a silent, baffling failure: the
# browser asks for a script, receives a page of HTML with status 200, and
# reports a syntax error from somewhere inside the bundle. That is exactly how
# the MapLibre worker failed - the asset was never emitted, the host answered
# with index.html, and the map rendered a basemap with no geometry on it.
#
# So hashed assets 404 when they are missing. A 404 is a fact an operator can
# act on; a 200 of the wrong content type is a mystery.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed filenames are content-addressed, so they can be cached forever...
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ...while the entry point must never be, or a deploy would be invisible to
    # a returning browser.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # The real workspace. "/" is the cinematic landing (index.html); the
    # application lives at "/app" (app.html), the same as on Vercel.
    location = /app {
        try_files /app.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /app.html {
        add_header Cache-Control "no-cache" always;
    }

    # An ES module worker is served as JavaScript. Some nginx builds do not map
    # .mjs, and a worker delivered as octet-stream is refused by the browser.
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Everything else: the application's own routes fall back to the entry
    # point. Deliberately last, and deliberately not reached by /assets/.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nothing here needs to know the server's version.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
